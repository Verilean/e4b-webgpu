<script>
// WebGPU trace hooks (Campaign 3: WGSL→tint→Metal runner) — installed BEFORE
// the engine module import. Adapted from hesper tools/replay/webml/trace.html
// with a per-op `plan` tag. Negligible overhead when not tracing.
(() => {
  const state = {
    tracing: false, plan: "",
    shaders: new Map(), shaderSeq: 0,
    pipelines: new Map(), pipeSeq: 0,
    bindgroups: new Map(),
    buffers: new Map(), bufSeq: 0,
    ops: [],
    mirror: new Map(),
  };
  window.__trace = state;
  const origCSM = GPUDevice.prototype.createShaderModule;
  GPUDevice.prototype.createShaderModule = function (desc) {
    const m = origCSM.call(this, desc);
    state.shaders.set(m, { id: state.shaderSeq++, code: desc.code });
    return m;
  };
  const origCB = GPUDevice.prototype.createBuffer;
  GPUDevice.prototype.createBuffer = function (desc) {
    const b = origCB.call(this, desc);
    state.buffers.set(b, { id: state.bufSeq++, size: desc.size });
    return b;
  };
  const wrapPipe = (p, desc) => {
    const sh = state.shaders.get(desc.compute.module);
    state.pipelines.set(p, { id: state.pipeSeq++, shaderId: sh ? sh.id : -1,
      entryPoint: desc.compute.entryPoint ?? null, constants: desc.compute.constants ?? null });
    return p;
  };
  const origCCP = GPUDevice.prototype.createComputePipeline;
  GPUDevice.prototype.createComputePipeline = function (desc) { return wrapPipe(origCCP.call(this, desc), desc); };
  const origCCPA = GPUDevice.prototype.createComputePipelineAsync;
  GPUDevice.prototype.createComputePipelineAsync = function (desc) {
    return origCCPA.call(this, desc).then((p) => wrapPipe(p, desc));
  };
  const origCBG = GPUDevice.prototype.createBindGroup;
  GPUDevice.prototype.createBindGroup = function (desc) {
    const bg = origCBG.call(this, desc);
    const entries = [];
    for (const e of desc.entries) {
      const r = e.resource;
      if (r && r.buffer) {
        const info = state.buffers.get(r.buffer);
        entries.push({ binding: e.binding, buf: info ? info.id : -1,
          bufSize: info ? info.size : -1, offset: r.offset ?? 0 });
      }
    }
    state.bindgroups.set(bg, entries);
    return bg;
  };
  const mirrorOf = (info) => {
    let m = state.mirror.get(info.id);
    if (!m) { m = new Uint8Array(info.size); state.mirror.set(info.id, m); }
    return m;
  };
  const origWB = GPUQueue.prototype.writeBuffer;
  GPUQueue.prototype.writeBuffer = function (buffer, bufferOffset, data, dataOffset, size) {
    const info = state.buffers.get(buffer);
    if (info && info.size <= 65536) {
      const bytes = data instanceof ArrayBuffer ? new Uint8Array(data)
        : new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      const elem = data instanceof ArrayBuffer ? 1 : (data.BYTES_PER_ELEMENT ?? 1);
      const off = (dataOffset ?? 0) * elem;
      const len = size !== undefined ? size * elem : bytes.length - off;
      mirrorOf(info).set(bytes.subarray(off, off + len), bufferOffset);
    }
    return origWB.call(this, buffer, bufferOffset, data, dataOffset, size);
  };
  const CPE = GPUComputePassEncoder.prototype;
  const origSP = CPE.setPipeline;
  CPE.setPipeline = function (p) { this.__pipe = state.pipelines.get(p); return origSP.call(this, p); };
  const origSBG = CPE.setBindGroup;
  CPE.setBindGroup = function (i, bg, ...rest) {
    (this.__bgs ??= {})[i] = state.bindgroups.get(bg);
    return origSBG.call(this, i, bg, ...rest);
  };
  const origDW = CPE.dispatchWorkgroups;
  CPE.dispatchWorkgroups = function (x, y = 1, z = 1) {
    if (state.tracing) {
      state.ops.push({ plan: state.plan, pipe: this.__pipe ? this.__pipe.id : -1, grid: [x, y, z],
        bgs: this.__bgs ? Object.entries(this.__bgs).map(([g, es]) => ({ group: +g, entries: es ?? [] })) : [] });
    }
    return origDW.call(this, x, y, z);
  };
})();
</script>
<script type="module">
// Resident A4B harness: loads 14.4GB ONCE, then long-polls /cmd and executes
// commands — kernel edits are picked up per command without weight reloads.
// Commands (POST /cmd, JSON):
//   {"mode":"gate","n":24[,"p":1]}   token match vs goldens-a4b.json (llama.cpp greedy)
//   {"mode":"bench","n":64}          pipelined decode timing
//   {"mode":"stats"}                 per-layer hidden meanAbs (NaN/explosion check)
//   {"mode":"reload"}                re-fetch kernels + rebuild pipelines
//   {"mode":"logits"}                step-0 top-8 logits for prompt 0
import { loadEngineA4B } from "./src/engine-a4b.js";
const L = (m) => fetch("/log", { method: "POST", body: String(m) }).catch(() => {});

(async () => {
  let eng;
  try {
    const t0 = performance.now();
    eng = await loadEngineA4B();
    L(`RESIDENT READY in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    L("DONE");
  } catch (e) { L("ERROR: " + (e && (e.stack || e.message) || e)); return; }
  const goldens = await (await fetch("goldens/goldens-a4b.json")).json();

  async function runCmd(cmd) {
    const t0 = performance.now();
    if (cmd.mode === "reload") {
      await eng.rebuildPipelines();
      L("kernels reloaded");
      return;
    }
    if (cmd.mode === "gate") {
      const nNew = cmd.n ?? 24;
      let allPass = true;
      for (let pi = 0; pi < goldens.prompts.length; pi++) {
        if (cmd.p !== undefined && pi !== cmd.p) continue;
        const g = goldens.prompts[pi];
        const want = g.generated_ids.slice(0, nNew);
        const got = await eng.generateFast(g.input_ids, want.length);
        const match = got.length === want.length && got.every((t, i) => t === want[i]);
        allPass = allPass && match;
        L(`[p${pi}] ${match ? "MATCH" : "MISMATCH"} got=${JSON.stringify(got)} want=${JSON.stringify(want)}`);
        if (!match) L(`[p${pi}] first divergence at ${got.findIndex((t, i) => t !== want[i])}`);
      }
      L(allPass ? "GATE PASS" : "GATE FAIL");
      return;
    }
    if (cmd.mode === "gate2") {
      // P5 correctness bar: generation after BATCHED prefill must be IDENTICAL
      // to the token-by-token gate (same goldens).
      const nNew = cmd.n ?? 24;
      let allPass = true;
      for (let pi = 0; pi < goldens.prompts.length; pi++) {
        if (cmd.p !== undefined && pi !== cmd.p) continue;
        const g = goldens.prompts[pi];
        const want = g.generated_ids.slice(0, nNew);
        const got = await eng.generatePrefill(g.input_ids, want.length);
        const match = got.length === want.length && got.every((t, i) => t === want[i]);
        allPass = allPass && match;
        L(`[p${pi}] ${match ? "MATCH" : "MISMATCH"} got=${JSON.stringify(got)}`);
        if (!match) L(`[p${pi}] first divergence at ${got.findIndex((t, i) => t !== want[i])}`);
      }
      L(allPass ? "GATE2 PASS" : "GATE2 FAIL");
      return;
    }
    if (cmd.mode === "prebench") {
      // prefill throughput: token-by-token step loop vs batched prefill, same M
      const m = cmd.m ?? 20;
      const iters = cmd.iters ?? 3;
      const ids = goldens.prompts[0].input_ids;
      const toks = Array.from({ length: m }, (_, i) => ids[i % ids.length]);
      for (const [name, fn] of [
        ["tokenwise", async () => { let pos = 0; for (const t of toks) await eng.step(t, pos++); }],
        ["batched", async () => { eng.prefill(toks); }],
      ]) {
        const ts = [];
        for (let it = 0; it < iters; it++) {
          const t0 = performance.now();
          await fn();
          await eng.device.queue.onSubmittedWorkDone();
          ts.push(performance.now() - t0);
        }
        const best = Math.min(...ts);
        L(`prefill ${name}: M=${m} best ${best.toFixed(1)}ms = ${(best / m).toFixed(2)}ms/tok (${ts.map((x) => x.toFixed(0)).join("/")})`);
      }
      return;
    }
    if (cmd.mode === "bench") {
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids) await eng.step(t, pos++);
      const n = cmd.n ?? 64;
      const t1 = performance.now();
      eng.decodeChunk(pos, n, 0);
      await eng.device.queue.onSubmittedWorkDone();
      const total = performance.now() - t1;
      L(`decode: ${(total / n).toFixed(2)}ms/token  ${(1000 / (total / n)).toFixed(1)} tok/s  (n=${n})`);
      return;
    }
    if (cmd.mode === "stats") {
      // per-layer hidden meanAbs on prompt-0 last token (submit layer by layer)
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids.slice(0, -1)) await eng.step(t, pos++);
      eng.device.queue.writeBuffer(eng.A.params, 0,
        new Uint32Array([pos, pos + 1, g.input_ids[g.input_ids.length - 1], 0]));
      const enc0 = eng.device.createCommandEncoder();
      const p0 = enc0.beginComputePass();
      eng.mkRun(p0)(eng.kern.embed, [eng.model.embQl, eng.model.embQh, eng.model.embSc,
        eng.model.embD, eng.A.params, eng.A.normed, eng.A.hidden, eng.A.amax], 1);
      p0.end(); eng.device.queue.submit([enc0.finish()]);
      let h = await eng.readHidden();
      L(`embed: meanAbs=${(h.reduce((a, b) => a + Math.abs(b), 0) / h.length).toFixed(4)} first4=${[...h.slice(0, 4)].map(x => x.toFixed(4))}`);
      for (const l of eng.layers) {
        const enc = eng.device.createCommandEncoder();
        const pass = enc.beginComputePass();
        // re-encode this layer only
        (function () {
          const run = eng.mkRun(pass);
          eng.encodeLayerPub(run, l, eng.A.params);
        })();
        pass.end(); eng.device.queue.submit([enc.finish()]);
        h = await eng.readHidden();
        const ma = h.reduce((a, b) => a + Math.abs(b), 0) / h.length;
        L(`layer${l.i}: meanAbs=${ma.toFixed(4)} first4=${[...h.slice(0, 4)].map(x => x.toFixed(4))}`);
        if (!isFinite(ma)) break;
      }
      return;
    }
    if (cmd.mode === "profile") {
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids) await eng.step(t, pos++);
      const prof = await eng.profileStep(0, pos);
      if (!prof) { L("no timestamp-query"); return; }
      const rows = [...prof.entries()].sort((a, b) => b[1].us - a[1].us);
      const tot = rows.reduce((a, r) => a + r[1].us, 0);
      L(`profile total (serialized): ${(tot / 1000).toFixed(2)}ms`);
      for (const [lb, e] of rows.slice(0, 16))
        L(`  ${(e.us / 1000).toFixed(3)}ms x${e.n}  ${lb.slice(0, 100)}`);
      return;
    }
    if (cmd.mode === "trace") {
      // Campaign 3: capture the step-plan (params-driven embed, for prompt
      // feeding) and the feed-plan (embedFeed reads amax, for generation) of
      // ONE token each, plus small-buffer contents → POST /trace.
      const t = window.__trace;
      const g = goldens.prompts[0];
      let pos = 0;
      for (const tk of g.input_ids.slice(0, -1)) await eng.step(tk, pos++);
      await eng.device.queue.onSubmittedWorkDone();
      t.ops = []; t.tracing = true;
      t.plan = "step";
      await eng.step(g.input_ids[g.input_ids.length - 1], pos++);
      await eng.device.queue.onSubmittedWorkDone();
      t.plan = "feed";
      eng.decodeChunk(pos, 1, 0);
      await eng.device.queue.onSubmittedWorkDone();
      t.tracing = false;
      const usedPipes = new Set(t.ops.map((o) => o.pipe));
      const pipes = [];
      for (const info of t.pipelines.values()) if (usedPipes.has(info.id)) pipes.push(info);
      const shaderIds = new Set(pipes.map((p) => p.shaderId));
      const shaders = [];
      for (const s of t.shaders.values()) if (shaderIds.has(s.id)) shaders.push(s);
      const usedBufs = new Set();
      for (const o of t.ops) for (const gg of o.bgs) for (const e of gg.entries) usedBufs.add(e.buf);
      const contents = {};
      for (const [id, bytes] of t.mirror) {
        if (!usedBufs.has(id)) continue;
        let bin = "";
        for (let i = 0; i < bytes.length; i += 8192)
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        contents[id] = btoa(bin);
      }
      await fetch("/trace", { method: "POST",
        body: JSON.stringify({ ops: t.ops, pipes, shaders, contents }) });
      L(`trace posted: ops=${t.ops.length} pipes=${pipes.length} bufs=${usedBufs.size}`);
      return;
    }
    if (cmd.mode === "dumpbufs") {
      // Dump every >64KB buffer bound by the last trace → POST /bin/<id>
      const t = window.__trace;
      const { readback } = await import("./src/gpu.js");
      const usedBufs = new Map();   // id -> {buf, size}
      const infoOf = new Map();
      for (const [buf, info] of t.buffers) infoOf.set(info.id, buf);
      for (const o of t.ops) for (const gg of o.bgs) for (const e of gg.entries) {
        if (e.bufSize > 65536 && !usedBufs.has(e.buf))
          usedBufs.set(e.buf, { buf: infoOf.get(e.buf), size: e.bufSize });
      }
      let done = 0, bytes = 0;
      for (const [id, { buf, size }] of usedBufs) {
        const data = await readback(eng.device, buf, size);
        await fetch("/bin/" + id, { method: "POST", body: data });
        done++; bytes += size;
        if (done % 25 === 0) L(`dump ${done}/${usedBufs.size} (${(bytes / 1e9).toFixed(1)}GB)`);
      }
      L(`dumpbufs done: ${done} buffers, ${(bytes / 1e9).toFixed(2)}GB`);
      return;
    }
    if (cmd.mode === "profile2") {
      const m = cmd.m ?? 64;
      const ids = goldens.prompts[0].input_ids;
      const toks = Array.from({ length: m }, (_, i) => ids[i % ids.length]);
      const prof = await eng.profilePrefill(toks);
      if (!prof) { L("no timestamp-query"); return; }
      const rows = [...prof.entries()].sort((a, b) => b[1].us - a[1].us);
      const tot = rows.reduce((a, r) => a + r[1].us, 0);
      L(`prefill profile (serialized, M=${m}): ${(tot / 1000).toFixed(2)}ms total = ${(tot / 1000 / m).toFixed(2)}ms/tok`);
      for (const [lb, e] of rows.slice(0, 14))
        L(`  ${(e.us / 1000).toFixed(3)}ms x${e.n}  ${lb.slice(0, 90)}`);
      return;
    }
    if (cmd.mode === "fencetest") {
      const { Kernels } = await import("./src/gpu.js");
      const K2 = new Kernels(eng.device);
      const dep = await K2.pipeline("fencetest", { DEP: 1 });
      const pp = await K2.pipeline("fencetest", { DEP: 2 });
      const waw = await K2.pipeline("fencetest", { DEP: 4 });
      const ind = await K2.pipeline("fencetest", { DEP: 0 });
      const bufA = eng.device.createBuffer({ size: 8192, usage: GPUBufferUsage.STORAGE });
      const bufB = eng.device.createBuffer({ size: 8192, usage: GPUBufferUsage.STORAGE });
      const N = 1000;
      for (const [name, k, ping] of [["same-buf RMW", dep, false], ["ping-pong RAW", pp, true], ["same-buf WAW", waw, false], ["independent", ind, false]]) {
        const enc = eng.device.createCommandEncoder();
        const pass = enc.beginComputePass();
        const mk = (a, b) => eng.device.createBindGroup({ layout: k.pipeline.getBindGroupLayout(0),
          entries: [{ binding: 0, resource: { buffer: a } }, { binding: 1, resource: { buffer: b } }] });
        const bgAB = mk(bufA, bufB), bgBA = mk(bufB, bufA);
        for (let i = 0; i < N; i++) {
          pass.setPipeline(k.pipeline);
          pass.setBindGroup(0, ping && (i & 1) ? bgBA : bgAB);
          pass.dispatchWorkgroups(1);
        }
        pass.end();
        const t0 = performance.now();
        eng.device.queue.submit([enc.finish()]);
        await eng.device.queue.onSubmittedWorkDone();
        const dt = performance.now() - t0;
        L(`fencetest ${name}: ${N} dispatches in ${dt.toFixed(2)}ms = ${(dt * 1000 / N).toFixed(2)}us/dispatch`);
      }
      return;
    }
    if (cmd.mode === "mvtest") {
      // synthetic XF16 q40mv check: known f16 x into A.geglu, run l0.downMv,
      // JS-recompute row 0 exactly from the repacked planes.
      const { readback } = await import("./src/gpu.js");
      const dev = eng.device, A = eng.A, l0 = eng.layers[0];
      const N = eng.C.inter;                       // 2112
      const xf = new Float16Array(N);
      for (let i = 0; i < N; i++) xf[i] = ((i * 13 + 5) % 17 - 8) / 8;
      dev.queue.writeBuffer(A.geglu, 0, xf.buffer.slice(0, N * 2));
      {
        const enc = dev.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setPipeline(l0.downMv.pipeline);
        pass.setBindGroup(0, eng.bindPub(l0.downMv, [A.mlpOut, l0.down.nibBuf, l0.down.scBuf, A.topkIdx, A.tmp, A.geglu]));
        pass.dispatchWorkgroups(Math.ceil(eng.C.hidden / 2));
        pass.end();
        dev.queue.submit([enc.finish()]);
      }
      const y = new Float32Array(await readback(dev, A.tmp, 16));
      const nib = new Uint8Array(await readback(dev, l0.down.nibBuf, N / 2));
      const scw = new Uint16Array(await readback(dev, l0.down.scBuf, Math.ceil(N / 32 / 2) * 4));
      const f16f = (h) => { const s2 = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 31, m = h & 1023;
        return e === 0 ? s2 * m * 2 ** -24 : (e === 31 ? NaN : s2 * (1 + m / 1024) * 2 ** (e - 15)); };
      let acc = 0;
      for (let b = 0; b < N / 32; b++) {
        const d = f16f(scw[b]);
        let bs = 0;
        for (let j = 0; j < 16; j++) {
          const byte = nib[b * 16 + j];
          bs += ((byte & 15) - 8) * xf[b * 32 + j] + ((byte >> 4) - 8) * xf[b * 32 + 16 + j];
        }
        acc += d * bs;
      }
      L(`mvtest: yGpu[0]=${y[0]} yJS=${acc}`);
      return;
    }
    if (cmd.mode === "features") {
      const ad = await navigator.gpu.requestAdapter();
      L("adapter features: " + [...ad.features].join(", "));
      L("device features: " + [...eng.device.features].join(", "));
      return;
    }
    if (cmd.mode === "logits") {
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids) await eng.step(t, pos++);
      const { readback } = await import("./src/gpu.js");
      const logits = new Float32Array(await readback(eng.device, eng.A.logits, eng.C.vocab * 4));
      const idx = [...logits.keys()].sort((a, b) => logits[b] - logits[a]).slice(0, 8);
      L("top8: " + idx.map((i) => `${i}:${logits[i].toFixed(3)}`).join(" "));
      return;
    }
    L("unknown mode " + cmd.mode);
  }

  while (true) {
    try {
      const r = await fetch("/cmd");
      if (r.status !== 200) continue;
      const cmd = JSON.parse(await r.text());
      if (cmd.mode === "ping") { L("pong"); L("DONE"); continue; }
      try { await runCmd(cmd); } catch (e) { L("ERROR: " + (e && (e.stack || e.message) || e)); }
      L("DONE");
    } catch (e) { await new Promise((res) => setTimeout(res, 1000)); }
  }
})();
</script>
</body></html>
