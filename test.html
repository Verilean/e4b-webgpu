<!doctype html>
<html><head><meta charset="utf-8"><title>e4b bring-up gate</title></head><body>
<script type="module">
// M3 golden gate: greedy token match vs the transformers f32-CPU oracle (goldens/).
import { loadEngine } from "./src/engine.js";
const L = (m) => fetch("/log", { method: "POST", body: String(m) }).catch(() => {});
(async () => {
  try {
    const goldens = await (await fetch("goldens/goldens.json")).json();
    const t0 = performance.now();
    const eng = await loadEngine();
    L(`engine loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    const q = new URLSearchParams(location.search);
    const nNew = parseInt(q.get("n") ?? "8");
    if (q.get("mode") === "logits") {
      // prompt-0 prefill → compare full logits vs the oracle (rounding vs real-bug discriminator)
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids) await eng.step(t, pos++);
      const { logits } = await eng.argmaxLogits();
      const ref = new Float32Array(await (await fetch("goldens/" + g.step0_logits_file)).arrayBuffer());
      let maxd = 0, maxi = 0;
      for (let i = 0; i < ref.length; i++) { const d = Math.abs(logits[i] - ref[i]); if (d > maxd) { maxd = d; maxi = i; } }
      const top = [...ref.keys()].sort((a, b) => ref[b] - ref[a]).slice(0, 5);
      L(`logits maxAbsDiff=${maxd.toFixed(5)} at ${maxi}; oracle top5=` +
        top.map((i) => `${i}:${ref[i].toFixed(3)}/${logits[i].toFixed(3)}`).join(" "));
      L(`argmax ours=${logits.indexOf(Math.max(...logits))} oracle=${g.step0_argmax}`);
      L("DONE");
      return;
    }
    if (q.get("mode") === "bench") {
      // steady decode timing + per-class GPU budget. Honest loop = step + argmax readback.
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids) await eng.step(t, pos++);
      let id = await eng.argmaxFast();
      const nSteps = parseInt(q.get("n") ?? "64");
      const t0 = performance.now();
      eng.decodeChunk(pos, nSteps, 0);
      await eng.device.queue.onSubmittedWorkDone();
      const total = performance.now() - t0;
      pos += nSteps;
      const med = total / nSteps, mean = med;
      const GB = 2.20;   // per-token weight read (DEVPLAN M0)
      L(`decode: median=${med.toFixed(2)}ms mean=${mean.toFixed(2)}ms  ${(1000 / med).toFixed(1)} tok/s  effBW=${(GB / (med / 1000)).toFixed(0)} GB/s  (n=${nSteps})`);
      if (q.get("mv") === "1") {
        // pure-kernel BW: one gate matvec dispatched 96× in one pass, rotating 3
        // output buffers (minimize WAW serialization). 13.1MB weight read each.
        const pure = async (label, kernE, bufs, groups, mb) => {
          const enc = eng.device.createCommandEncoder();
          const pass = enc.beginComputePass();
          for (let i = 0; i < 64; i++) {
            pass.setPipeline(kernE.pipeline);
            pass.setBindGroup(0, eng.bindPub(kernE, bufs));
            pass.dispatchWorkgroups(...(Array.isArray(groups) ? groups : [groups]));
          }
          pass.end();
          const t0 = performance.now();
          eng.device.queue.submit([enc.finish()]);
          await eng.device.queue.onSubmittedWorkDone();
          const dt = performance.now() - t0;
          L(`mvbench ${label}: ${(dt * 1000 / 64).toFixed(1)}us each = ${(64 * mb / dt).toFixed(0)} GB/s`);
        };
        const l = eng.layers[5];
        await pure("guMv", l.guMv, [eng.A.xq3, l.gu.wBuf, l.gu.wsBuf, l.gu.srqsBuf, eng.A.gu], Math.ceil(l.gu.out / 2), 26.2);
        await pure("downMv", l.downMv, [eng.A.xq, l.down.wBuf, l.down.wsBuf, l.down.srqBuf, eng.A.tmp], Math.ceil(eng.C.hidden / 2), 13.1);
        await pure("lmhead", eng.kern.lmHead, [eng.A.normed, eng.model.lmHeadQ, eng.model.lmHeadS, eng.A.logits], [32768, Math.ceil(eng.C.vocab / 32 / 32768)], 167.8);
        await pure("attA(sl)", l.kern.attA, [{ buffer: eng.A.qkv, offset: 0, size: l.qOut * 4 }, l.kCache ?? eng.layers[4].kCache, l.vCache ?? eng.layers[4].vCache, eng.A.params, eng.A.attPartO, eng.A.attPartME], [eng.C.qHeads, 10], 0.1);
      }
      const prof = await eng.profileStep(id, pos);
      if (prof) {
        const rows = [...prof.entries()].sort((a, b) => b[1].us - a[1].us);
        const tot = rows.reduce((a, r) => a + r[1].us, 0);
        L(`profile total (serialized upper bound): ${(tot / 1000).toFixed(2)}ms`);
        for (const [lb, e] of rows.slice(0, 14))
          L(`  ${(e.us / 1000).toFixed(3)}ms  x${e.n}  ${lb.slice(0, 110)}`);
      } else L("timestamp-query unavailable");
      L("DONE");
      return;
    }
    if (q.get("mode") === "xqdiff") {
      // run layer0 with the fused boundary (rmsaccNext) vs explicit rmssrq3 for
      // layer1's input quant; diff the xq3 buffers.
      const { readback } = await import("./src/gpu.js");
      const g = goldens.prompts[0];
      const dev = eng.device, A = eng.A, kern = eng.kern, l0 = eng.layers[0], l1 = eng.layers[1];
      // one full fused step for token 0 at pos 0 — but stop after layer 0:
      dev.queue.writeBuffer(A.params, 0, new Uint32Array([0, 1, g.input_ids[0], 0]));
      const seen = [];
      {
        const enc = dev.createCommandEncoder();
        const pass = enc.beginComputePass();
        const ctx = { run: (k, b, gr) => { seen.push(k.pipeline.label.slice(0, 60)); pass.setPipeline(k.pipeline); pass.setBindGroup(0, eng.bindPub(k, b)); pass.dispatchWorkgroups(...(Array.isArray(gr) ? gr : [gr])); } };
        eng.encodePre(ctx);
        eng.encodeLayerPub(ctx, l0);       // ends with rmsaccNext → xq3 for layer1
        pass.end();
        dev.queue.submit([enc.finish()]);
      }
      L(`last3 dispatches: ${seen.slice(-3).join(" | ")}`);
      L(`l0.next defined: ${!!l0.next}, l0.rmsaccNext: ${!!l0.rmsaccNext}`);
      const fused = new Uint32Array(await readback(dev, A.xq3, 3 * eng.C.hidden));
      const hiddenAfter = new Float32Array(await readback(dev, A.hidden, eng.C.hidden * 4));
      {
        const enc = dev.createCommandEncoder();
        const pass = enc.beginComputePass();
        const ctx = { run: (k, b, gr) => { pass.setPipeline(k.pipeline); pass.setBindGroup(0, eng.bindPub(k, b)); pass.dispatchWorkgroups(...(Array.isArray(gr) ? gr : [gr])); } };
        ctx.run(kern.rmssrq3, [A.hidden, l1.inNorm, l1.qkvScales, A.xq3, A.xqSums], 1);
        pass.end();
        dev.queue.submit([enc.finish()]);
      }
      const explicit = new Uint32Array(await readback(dev, A.xq3, 3 * eng.C.hidden));
      let nd = 0, firstIdx = -1;
      for (let i = 0; i < fused.length; i++) if (fused[i] !== explicit[i]) { nd++; if (firstIdx < 0) firstIdx = i; }
      L(`xqdiff: ${nd}/${fused.length} words differ, first at ${firstIdx}`);
      if (firstIdx >= 0) L(`  fused=${fused[firstIdx].toString(16)} explicit=${explicit[firstIdx].toString(16)} region=${Math.floor(firstIdx / 640)}`);
      L(`hidden[0..4]=${[...hiddenAfter.slice(0, 4)].map((x) => x.toFixed(5)).join(",")}`);
      if (q.get("row0") === "1") {
        // exact JS recomputation of layer1 q-proj row 0 vs the GPU's A.qkv[0]
        const xq3 = new Int8Array(await readback(dev, A.xq3, 2560));      // region 0
        const xs = new Float32Array(await readback(dev, A.xqSums, 16));
        // run layer1's qkv matvec on the current xq3
        {
          const enc2 = dev.createCommandEncoder();
          const pass2 = enc2.beginComputePass();
          const c2 = { run: (k, b, gr) => { pass2.setPipeline(k.pipeline); pass2.setBindGroup(0, eng.bindPub(k, b)); pass2.dispatchWorkgroups(...(Array.isArray(gr) ? gr : [gr])); } };
          c2.run(l1.qkvMv, [A.xq3, l1.qkv.wBuf, l1.qkv.wsBuf, l1.qkv.srqsBuf, A.qkv, A.xqSums], [Math.ceil(l1.qkv.out / 2)]);
          pass2.end();
          dev.queue.submit([enc2.finish()]);
        }
        const yGpu = new Float32Array(await readback(dev, A.qkv, 16));
        const wRow = new Uint8Array(await readback(dev, l1.qkv.wBuf, 1280)); // row 0 int4
        // JS exact: sum (v-8)*q
        let acc = 0, sq = 0;
        for (let i = 0; i < 2560; i++) {
          const b = wRow[i >> 1];
          const v = (i & 1) ? (b >> 4) : (b & 15);
          acc += (v - 8) * xq3[i];
          sq += xq3[i];
        }
        const ws0 = new Float32Array(await readback(dev, l1.qkv.wsBuf, 4))[0];
        const sqv = new Float32Array(await readback(dev, l1.qkv.srqsBuf, 8));
        let yExp = acc * sqv[0] * ws0;
        if (sqv[1] !== 0) yExp = Math.max(-128, Math.min(127, Math.round(yExp / sqv[1]))) * sqv[1];
        L(`row0: exactSum=${acc} xsum[0]=${xs[0]} yGpu[0]=${yGpu[0]} yExpected=${yExp} ws0=${ws0} inS=${sqv[0]} outS=${sqv[1]}`);
        const meta = await fetch("/log", { method: "POST", body: "row0 done" });
      }
      // JS recomputation of the expected quantization for elements 0..3
      const w2v = new Float32Array(await readback(dev, l1.inNorm, 16));
      const scv = new Float32Array(await readback(dev, l1.qkvScales, 12));
      let ss = 0; for (const h of hiddenAfter) ss += h * h;
      const inv2 = Math.pow(ss / hiddenAfter.length + 1e-6, -0.5);
      const expQ = [0, 1, 2, 3].map((k) => Math.round(hiddenAfter[k] * inv2 * w2v[k] / scv[0]));
      L(`inv2=${inv2.toFixed(5)} w2[0..3]=${[...w2v].map((x) => x.toFixed(4)).join(",")} sc=${[...scv.slice(0, 3)].map((x) => x.toFixed(4)).join(",")}`);
      L(`expected q[0..3]=${expQ.join(",")}`);
      const dec = (w) => [0, 1, 2, 3].map((k) => ((w >> (k * 8)) & 0xff) << 24 >> 24);
      L(`fused    q[0..3]=${dec(fused[0]).join(",")}`);
      L(`explicit q[0..3]=${dec(explicit[0]).join(",")}`);
      L("DONE");
      return;
    }
    if (q.get("mode") === "downtest") {
      // synthetic, fully controlled test of the ZP=1 (unorm/snorm + sumI) matvec:
      // JS writes known xq + sumI, dispatches downMvZ, compares row 0 vs exact JS.
      const { readback } = await import("./src/gpu.js");
      const dev = eng.device, A = eng.A, l0 = eng.layers[0];
      const N = eng.C.inter;
      const qv = new Int8Array(N);
      let sq = 0;
      for (let i = 0; i < N; i++) { qv[i] = ((i * 37 + 11) % 255) - 127; sq += qv[i]; }
      dev.queue.writeBuffer(A.xq, 0, qv.buffer);
      dev.queue.writeBuffer(A.xqSumI, 0, new Int32Array([sq, 0, 0, 0]).buffer);
      {
        const enc = dev.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setPipeline(l0.downMvZ.pipeline);
        pass.setBindGroup(0, eng.bindPub(l0.downMvZ, [A.xq, l0.down.wBuf, l0.down.wsBuf, l0.down.srqBuf, A.tmp, A.xqSumI]));
        pass.dispatchWorkgroups(Math.ceil(eng.C.hidden / 2));
        pass.end();
        dev.queue.submit([enc.finish()]);
      }
      const yz = new Float32Array(await readback(dev, A.tmp, 16));
      // reference: ZP=0 kernel on the same data
      {
        const enc = dev.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setPipeline(l0.downMv.pipeline);
        pass.setBindGroup(0, eng.bindPub(l0.downMv, [A.xq, l0.down.wBuf, l0.down.wsBuf, l0.down.srqBuf, A.tmp, A.xqSumI]));
        pass.dispatchWorkgroups(Math.ceil(eng.C.hidden / 2));
        pass.end();
        dev.queue.submit([enc.finish()]);
      }
      const ys = new Float32Array(await readback(dev, A.tmp, 16));
      // exact JS row 0
      const wRow = new Uint8Array(await readback(dev, l0.down.wBuf, N / 2));
      const ws0 = new Float32Array(await readback(dev, l0.down.wsBuf, 4))[0];
      const sr = new Float32Array(await readback(dev, l0.down.srqBuf, 8));
      let acc = 0;
      for (let i = 0; i < N; i++) {
        const b = wRow[i >> 1];
        const v = (i & 1) ? (b >> 4) : (b & 15);
        acc += (v - 8) * qv[i];
      }
      let yExp = acc * sr[0] * ws0;
      if (sr[1] !== 0) yExp = Math.max(-128, Math.min(127, Math.round(yExp / sr[1]))) * sr[1];
      L(`downtest: exactSum=${acc} sumQ=${sq} yJS=${yExp} yZP0=${ys[0]} yZP1=${yz[0]}  [1]: zp0=${ys[1]} zp1=${yz[1]}`);
      L("DONE");
      return;
    }
    if (q.get("mode") === "bisect") {
      // per-layer hidden comparison vs goldens.layer_fingerprints (p0, last prompt position)
      const g = goldens.prompts[0];
      let pos = 0;
      for (const t of g.input_ids.slice(0, -1)) await eng.step(t, pos++);
      const fps = g.layer_fingerprints;   // [0]=embedding output, [i+1]=after layer i
      let fi = 0;
      await eng.stepBisect(g.input_ids[g.input_ids.length - 1], pos, async (stage, h) => {
        const fp = fps[fi++];
        if (!fp) return;
        let ma = 0;
        for (let j = 0; j < h.length; j++) ma += Math.abs(h[j]);
        ma /= h.length;
        const wantMa = fp.meanAbs;
        const d8 = fp.first8.map((v, j) => Math.abs(h[j] - v));
        const worst = Math.max(...d8);
        L(`${stage}: meanAbs=${ma.toFixed(4)} want=${wantMa.toFixed(4)} ratio=${(ma / wantMa).toFixed(4)} first8MaxDiff=${worst.toFixed(5)}`);
      });
      L("DONE");
      return;
    }
    const only = q.get("p");   // limit to one prompt index
    let allPass = true;
    for (let pi = 0; pi < goldens.prompts.length; pi++) {
      if (only !== null && only !== undefined && only !== "" && pi !== parseInt(only)) continue;
      const g = goldens.prompts[pi];
      const want = g.generated_ids.slice(0, nNew);
      const tGen = performance.now();
      const got = await eng.generateFast(g.input_ids, want.length);
      const ms = performance.now() - tGen;
      const match = got.every((t, i) => t === want[i]);
      allPass = allPass && match;
      L(`[p${pi}] ${match ? "MATCH" : "MISMATCH"} got=${JSON.stringify(got)} want=${JSON.stringify(want)} ` +
        `(${(ms / (g.input_ids.length + got.length)).toFixed(0)} ms/token)`);
      if (!match) {
        const k = got.findIndex((t, i) => t !== want[i]);
        L(`[p${pi}] first divergence at generated index ${k}`);
      }
    }
    L(allPass ? "GATE PASS" : "GATE FAIL");
    L("DONE");
  } catch (e) {
    L("ERROR: " + (e && (e.stack || e.message) || e));
  }
})();
</script>
</body></html>
