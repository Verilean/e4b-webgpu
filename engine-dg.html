<!doctype html>
<meta charset="utf-8">
<title>DG engine</title>
<body>
<pre>DG trace-replay engine — src/engine-dg.js</pre>
<script type="module">
import { runEngine } from "./src/engine-dg.js";
const L = (m) => fetch("/log", { method: "POST", body: String(m) }).catch(() => {});
const q = new URLSearchParams(location.search);
const seed = parseInt(q.get("seed") || "12345");
const prof = q.get("prof") === "1";
const expect = q.get("expect") || null;
try { await runEngine("dgtrace", { seed, prof, expect }); } catch (e) { await L("ENGINE EXCEPTION: " + (e.stack || e)); }
</script>
